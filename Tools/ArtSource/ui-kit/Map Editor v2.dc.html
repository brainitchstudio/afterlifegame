<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#171a14;color:#d6d8c6;overflow:hidden}a{color:#c5d48a}a:hover{color:#d9e6a4}canvas{image-rendering:pixelated}input,select,button{font-family:'IBM Plex Mono',monospace}input[type=number]{-moz-appearance:textfield}</style>
</helmet>
<div style="height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);font-family:'IBM Plex Mono',monospace;font-size:12px;color:#d6d8c6">
  <header style="display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid #2a2f24;background:#1b1f17">
    <span style="font-family:'Silkscreen',monospace;font-size:16px;color:#e4e6d2;margin-right:4px">Map Editor</span>
    <input value="{{ name }}" onChange="{{ setName }}" title="Map name" style="width:140px;background:#12150f;border:1px solid #3d4434;color:#e4e6d2;padding:7px 8px;font-size:12px">
    <div style="display:flex;border:1px solid #3d4434">
      <sc-for list="{{ seasons }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.pick }}" style="font-family:'Silkscreen',monospace;font-size:11px;background:{{ s.bg }};color:{{ s.fg }};border:0;padding:8px 10px;cursor:pointer">{{ s.label }}</button>
      </sc-for>
    </div>
    <select value="{{ light }}" onChange="{{ setLight }}" title="Time of day" style="background:#12150f;border:1px solid #3d4434;color:#d6d8c6;padding:7px 6px;font-size:12px">
      <sc-for list="{{ lights }}" as="l" hint-placeholder-count="7"><option value="{{ l.id }}">{{ l.label }}</option></sc-for>
    </select>
    <div style="flex:1"></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <button onClick="{{ undo }}" title="Undo (Ctrl+Z)" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:7px 10px;cursor:pointer;font-size:12px;opacity:{{ undoOp }}" style-hover="border-color:#c5d48a">Undo</button>
      <button onClick="{{ redo }}" title="Redo (Ctrl+Shift+Z)" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:7px 10px;cursor:pointer;font-size:12px;opacity:{{ redoOp }}" style-hover="border-color:#c5d48a">Redo</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <button onClick="{{ newMap }}" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:7px 10px;cursor:pointer;font-size:12px" style-hover="border-color:#c5d48a;color:#c5d48a">New</button>
      <button onClick="{{ openMap }}" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:7px 10px;cursor:pointer;font-size:12px" style-hover="border-color:#c5d48a;color:#c5d48a">Open</button>
      <button onClick="{{ saveMap }}" title="Download the editor project (.survmap.json)" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:7px 10px;cursor:pointer;font-size:12px" style-hover="border-color:#c5d48a;color:#c5d48a">Save</button>
      <button onClick="{{ exportPng }}" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:7px 10px;cursor:pointer;font-size:12px" style-hover="border-color:#c5d48a;color:#c5d48a">PNG</button>
      <button onClick="{{ exportUnity }}" title="Zip with map JSON, sprite atlas and a C# loader" style="font-family:'Silkscreen',monospace;font-size:12px;background:#c5d48a;color:#1a1e14;border:0;padding:9px 14px;cursor:pointer" style-hover="background:#d9e6a4">{{ exportLabel }}</button>
    </div>
    <input type="file" accept=".json,application/json" data-open="1" onChange="{{ onFile }}" style="display:none">
  </header>

  <div style="display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0">
    <aside style="display:flex;flex-direction:column;min-height:0;overflow-y:auto;border-right:1px solid #2a2f24;background:#1b1f17">

      <div style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-bottom:1px solid #2a2f24">
        <span style="font-family:'Silkscreen',monospace;font-size:10px;color:#8b8f78;margin-bottom:2px">Layers</span>
        <sc-for list="{{ layers }}" as="l" hint-placeholder-count="4">
          <div style="display:flex;gap:4px">
            <button onClick="{{ l.pick }}" style="flex:1;min-width:0;display:flex;justify-content:space-between;gap:8px;text-align:left;background:{{ l.bg }};border:1px solid {{ l.bd }};color:{{ l.fg }};padding:7px 8px;font-size:11px;cursor:pointer">
              <span>{{ l.label }}</span><span style="opacity:.6">{{ l.count }}</span>
            </button>
            <button onClick="{{ l.toggleVis }}" title="Show or hide this layer" style="width:58px;font-size:10px;background:transparent;border:1px solid #2a2f24;color:{{ l.visFg }};cursor:pointer" style-hover="border-color:#6f7d45">{{ l.visLabel }}</button>
            <button onClick="{{ l.toggleLock }}" title="Lock to stop edits on this layer" style="width:58px;font-size:10px;background:transparent;border:1px solid #2a2f24;color:{{ l.lockFg }};cursor:pointer" style-hover="border-color:#6f7d45">{{ l.lockLabel }}</button>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:10px;padding:12px;border-bottom:1px solid #2a2f24;background:#1f2419">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
            <span style="font-family:'Silkscreen',monospace;font-size:12px;color:#e4e6d2">{{ selTitle }}</span>
            <span style="font-size:10px;color:#8b8f78">{{ selSub }}</span>
          </div>
          <sc-for list="{{ selRows }}" as="r">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="width:56px;flex:none;font-size:11px;color:#8b8f78">{{ r.label }}</span>
              <div style="display:flex;flex-wrap:wrap;border:1px solid #3d4434">
                <sc-for list="{{ r.opts }}" as="o"><button onClick="{{ o.pick }}" style="font-size:11px;background:{{ o.bg }};color:{{ o.fg }};border:0;padding:5px 8px;cursor:pointer">{{ o.label }}</button></sc-for>
              </div>
            </div>
          </sc-for>
          <div style="display:flex;gap:6px">
            <button onClick="{{ dupSel }}" title="Ctrl+D" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:6px 10px;cursor:pointer;font-size:11px" style-hover="border-color:#c5d48a;color:#c5d48a">Duplicate</button>
            <button onClick="{{ delSel }}" title="Delete" style="background:transparent;color:#d0694f;border:1px solid #3d4434;padding:6px 10px;cursor:pointer;font-size:11px" style-hover="border-color:#d0694f">Delete</button>
            <button onClick="{{ clearSel }}" title="Esc" style="margin-left:auto;background:transparent;color:#8b8f78;border:1px solid #2a2f24;padding:6px 10px;cursor:pointer;font-size:11px" style-hover="color:#d6d8c6">Deselect</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ showCats }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px 0">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="2">
            <button onClick="{{ c.pick }}" style="font-family:'Silkscreen',monospace;font-size:10px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }};padding:6px 8px;cursor:pointer">{{ c.label }}</button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ gateOpts }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 0;align-items:center">
          <div style="display:flex;border:1px solid #3d4434">
            <sc-for list="{{ gateStates }}" as="g"><button onClick="{{ g.pick }}" style="font-size:11px;background:{{ g.bg }};color:{{ g.fg }};border:0;padding:6px 10px;cursor:pointer">{{ g.label }}</button></sc-for>
          </div>
          <sc-if value="{{ sideOpts }}">
            <div style="display:flex;border:1px solid #3d4434">
              <sc-for list="{{ gateSides }}" as="g"><button onClick="{{ g.pick }}" title="{{ g.title }}" style="font-size:11px;background:{{ g.bg }};color:{{ g.fg }};border:0;padding:6px 10px;cursor:pointer">{{ g.label }}</button></sc-for>
            </div>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ baseOpts }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:8px;padding:10px 12px 0">
          <p style="margin:0;font-size:11px;line-height:1.5;color:#8b8f78;text-wrap:pretty">Base tiles are where the player can build at the start. They export as the buildable grid.</p>
          <div style="display:flex;gap:6px">
            <button onClick="{{ baseAuto }}" title="Marks every tile enclosed by walls and gates, plus the walls" style="background:#2a3120;color:#c5d48a;border:1px solid #6f7d45;padding:6px 10px;cursor:pointer;font-size:11px" style-hover="border-color:#c5d48a">Fill inside walls</button>
            <button onClick="{{ baseClear }}" style="background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:6px 10px;cursor:pointer;font-size:11px" style-hover="border-color:#c5d48a">Clear all</button>
          </div>
        </div>
      </sc-if>

      <div style="flex:1 0 180px;padding:12px">
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="9">
            <button onClick="{{ it.pick }}" title="{{ it.label }}" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:8px 4px 6px;min-height:88px;background:{{ it.bg }};border:1px solid {{ it.bd }};cursor:pointer" style-hover="border-color:#6f7d45">
              <div style="flex:1;display:grid;place-items:center"><canvas data-thumb="{{ it.thumb }}" data-mk="{{ it.mk }}"></canvas></div>
              <span style="font-size:10px;line-height:1.2;text-align:center;color:{{ it.fg }}">{{ it.label }}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-top:1px solid #2a2f24">
        <span style="font-family:'Silkscreen',monospace;font-size:10px;color:#8b8f78">Checks</span>
        <sc-for list="{{ checks }}" as="c" hint-placeholder-count="1">
          <button onClick="{{ c.pick }}" style="display:flex;gap:8px;text-align:left;background:transparent;border:0;padding:0;font-size:11px;line-height:1.45;color:{{ c.fg }};cursor:pointer" style-hover="color:#e4e6d2">
            <span style="flex:none;width:6px;height:6px;margin-top:5px;background:{{ c.dot }}"></span><span style="text-wrap:pretty">{{ c.text }}</span>
          </button>
        </sc-for>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;padding:12px;border-top:1px solid #2a2f24">
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:11px;color:#8b8f78;width:40px">Size</span>
          <input type="number" min="8" max="256" value="{{ rw }}" onChange="{{ setRw }}" title="Width in tiles" style="width:52px;background:#12150f;border:1px solid #3d4434;color:#e4e6d2;padding:6px;font-size:12px">
          <span style="color:#8b8f78">×</span>
          <input type="number" min="8" max="256" value="{{ rh }}" onChange="{{ setRh }}" title="Height in tiles" style="width:52px;background:#12150f;border:1px solid #3d4434;color:#e4e6d2;padding:6px;font-size:12px">
          <button onClick="{{ resize }}" style="margin-left:auto;background:transparent;color:#d6d8c6;border:1px solid #3d4434;padding:6px 10px;cursor:pointer;font-size:11px" style-hover="border-color:#c5d48a;color:#c5d48a">Resize</button>
        </div>
      </div>
    </aside>

    <main data-wrap="1" style="position:relative;min-width:0;min-height:0;overflow:hidden;background:#0e100c">
      <canvas data-editor="1" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block"></canvas>
      <div style="position:absolute;left:12px;top:12px;max-height:calc(100% - 54px);overflow-y:auto;scrollbar-width:none;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:3px;background:rgba(27,31,23,0.96);border:1px solid #3d4434;box-shadow:0 4px 0 rgba(0,0,0,0.35)">
        <button onClick="{{ tb.hand.pick }}" title="{{ tb.hand.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.hand.bg }};color:{{ tb.hand.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.hand.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges"><path d="M6 1h2v7H6zM4 3h2v5H4zM8 2h2v6H8zM10 4h2v6h-2zM1 7h2v2H1zM2 9h2v2H2zM3 10h2v2H3zM4 8h8v5H4zM5 13h6v2H5z"></path></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">H</span></button>
        <button onClick="{{ tb.select.pick }}" title="{{ tb.select.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.select.bg }};color:{{ tb.select.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.select.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1v13l3.2-3.2 2.1 4.4 2.2-1.1-2.1-4.3H13z"></path></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">V</span></button>
        <div style="height:1px;background:#3d4434;margin:3px 4px"></div>
        <button onClick="{{ tb.paint.pick }}" title="{{ tb.paint.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.paint.bg }};color:{{ tb.paint.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.paint.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 1l3.5 3.5-1.6 1.6-3.5-3.5zM9 3.5L12.5 7 5.5 14 1 15l1-4.5z"></path></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">B</span></button>
        <button onClick="{{ tb.line.pick }}" title="{{ tb.line.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.line.bg }};color:{{ tb.line.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.line.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 12.5l9-9" stroke="currentColor" stroke-width="2"></path><rect x="1" y="11" width="4" height="4"></rect><rect x="11" y="1" width="4" height="4"></rect></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">L</span></button>
        <button onClick="{{ tb.rect.pick }}" title="{{ tb.rect.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.rect.bg }};color:{{ tb.rect.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.rect.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges"><path fill-rule="evenodd" d="M1 3h14v10H1zM3 5v6h10V5z"></path></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">R</span></button>
        <button onClick="{{ tb.fill.pick }}" title="{{ tb.fill.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.fill.bg }};color:{{ tb.fill.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.fill.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 8.5L7 3l5.5 5.5L7 14z"></path><path d="M4.5 1.5L8 5" stroke="currentColor" stroke-width="1.6" fill="none"></path><path d="M14 9c-1.2 1.7-1.7 2.7-1.7 3.3a1.7 1.7 0 003.4 0c0-.6-.5-1.6-1.7-3.3z"></path></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">G</span></button>
        <button onClick="{{ tb.erase.pick }}" title="{{ tb.erase.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.erase.bg }};color:{{ tb.erase.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.erase.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M9.5 1.5l5 5-4 4-5-5z"></path><path d="M4.8 6.2l5 5L7.5 13.5h-3L1.5 10.5z" fill-opacity=".55"></path><rect x="8" y="13" width="7" height="1.6"></rect></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">E</span></button>
        <button onClick="{{ tb.pick.pick }}" title="{{ tb.pick.title }}" style="position:relative;width:40px;height:40px;display:grid;place-items:center;background:{{ tb.pick.bg }};color:{{ tb.pick.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.pick.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M12 1.2a2 2 0 012.8 2.8l-2 2 .9.9-1.4 1.4-.9-.9-5.6 5.6H2.5v-3.3l5.6-5.6-.9-.9 1.4-1.4.9.9z"></path></svg><span style="position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55">I</span></button>
        <div style="height:1px;background:#3d4434;margin:3px 4px"></div>
        <button onClick="{{ tb.grid.pick }}" title="{{ tb.grid.title }}" style="width:40px;height:40px;display:grid;place-items:center;background:{{ tb.grid.bg }};color:{{ tb.grid.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.grid.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 1.5h13v13h-13zM5.8 1.5v13M10.2 1.5v13M1.5 5.8h13M1.5 10.2h13"></path></svg></button>
        <button onClick="{{ tb.col.pick }}" title="{{ tb.col.title }}" style="width:40px;height:40px;display:grid;place-items:center;background:{{ tb.col.bg }};color:{{ tb.col.fg }};border:0;padding:0;cursor:pointer" style-hover="background:{{ tb.col.hov }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h12v12H2zM2 2l12 12M14 2L2 14"></path></svg></button>
      </div>
      <div style="position:absolute;top:12px;left:68px;right:12px;display:flex;pointer-events:none">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;max-width:100%;padding:7px 12px;min-height:30px;box-sizing:border-box;background:rgba(27,31,23,0.96);border:1px solid #3d4434;box-shadow:0 4px 0 rgba(0,0,0,0.35);pointer-events:auto">
          <span style="font-family:'Silkscreen',monospace;font-size:12px;color:#e4e6d2">{{ toolName }}</span>
          <sc-if value="{{ showBrush }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid #3d4434">
              <div style="width:24px;height:24px;display:grid;place-items:center"><canvas data-thumb="{{ brushThumb }}" data-mk="{{ brushMk }}" data-max="24"></canvas></div>
              <span style="font-size:11px;color:#c5d48a">{{ brushLabel }}</span>
            </div>
          </sc-if>
          <span style="flex:1 1 240px;padding-left:12px;border-left:1px solid #3d4434;font-size:11px;line-height:1.45;color:{{ hintFg }};text-wrap:pretty">{{ hint }}</span>
        </div>
      </div>
      <div style="position:absolute;right:12px;bottom:42px;display:flex;align-items:stretch;background:rgba(27,31,23,0.96);border:1px solid #3d4434;box-shadow:0 4px 0 rgba(0,0,0,0.35)">
        <button onClick="{{ zoomOut }}" title="Zoom out (-)" style="width:34px;height:34px;background:transparent;color:#d6d8c6;border:0;font-size:16px;cursor:pointer" style-hover="background:#2a3120">−</button>
        <span style="min-width:52px;display:grid;place-items:center;font-size:11px;color:#d6d8c6;border-left:1px solid #2a2f24;border-right:1px solid #2a2f24">{{ zoomPct }}</span>
        <button onClick="{{ zoomIn }}" title="Zoom in (+)" style="width:34px;height:34px;background:transparent;color:#d6d8c6;border:0;font-size:16px;cursor:pointer" style-hover="background:#2a3120">+</button>
        <button onClick="{{ zoomFit }}" title="Fit map (0)" style="width:34px;height:34px;display:grid;place-items:center;background:transparent;color:#d6d8c6;border:0;border-left:1px solid #2a2f24;cursor:pointer" style-hover="background:#2a3120"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"></path></svg></button>
      </div>
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute;inset:0;display:grid;place-items:center;font-family:'Silkscreen',monospace;font-size:14px;color:#8b8f78">Generating sprites…</div>
      </sc-if>
      <div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;padding:7px 12px;background:rgba(18,21,15,0.92);border-top:1px solid #2a2f24;font-size:11px;color:#8b8f78;pointer-events:none">
        <span data-status="1" style="color:#d6d8c6"></span>
        <span>{{ info }}</span>
      </div>
    </main>
  </div>
</div>
</x-dc>

      else if (one.t === 'tree') { const dec = one.k.startsWith('deco_'), L = dec ? DECO.filter(([k]) => !DFP[k] === !DFP[one.k]) : TREES; row('Type', L, one.k, (o, v) => { o.k = v; }); }

    const fpS = one && !isMark(one) ? this.fp(one) : [1, 1];
    return {
      loading: S.loading, name: S.name, light: S.light, rw: S.rw, rh: S.rh, hint, hintFg: locked ? '#d4a24a' : '#8b8f78',
      exportLabel: S.busy ? 'Exporting…' : 'Export for Unity',
      info: M ? `${M.w} × ${M.h} tiles  ·  ${M.objs.length} objects  ·  ${M.marks.length} markers` + (sel.length ? `  ·  ${sel.length} selected` : '') + `  ·  ${S.zoom}×` : '',
      undoOp: this.undoS.length ? 1 : 0.4, redoOp: this.redoS.length ? 1 : 0.4,
      seasons: ['spring', 'summer', 'fall', 'winter'].map(n => seg(n === S.season, () => { this.setState({ season: n }); setTimeout(() => this.save()); }, lab(n))),
      lights: LIGHTS.map(n => ({ id: n, label: lab(n) })),
      setLight: e => { this.setState({ light: e.target.value }); setTimeout(() => this.save()); },
      setName: e => { const v = e.target.value; if (this.M) this.M.name = v; this.setState({ name: v }); this.save(); },
      setRw: e => this.setState({ rw: e.target.value }), setRh: e => this.setState({ rh: e.target.value }),
      resize: () => { if (!M) return; const w = Math.max(8, Math.min(256, parseInt(S.rw) || 40)), h = Math.max(8, Math.min(256, parseInt(S.rh) || 28)); this.commit(() => { const t = new Array(w * h).fill('g'), f = new Array(w * h).fill(null), bs = new Array(w * h).fill(0); for (let y = 0; y < Math.min(h, M.h); y++) for (let x = 0; x < Math.min(w, M.w); x++) { t[y * w + x] = M.terr[y * M.w + x]; f[y * w + x] = M.fixed[y * M.w + x]; bs[y * w + x] = M.base[y * M.w + x]; } M.w = w; M.h = h; M.terr = t; M.fixed = f; M.base = bs; M.objs = M.objs.filter(o => { const [fw, fh] = this.fp(o); return o.tx >= 0 && o.ty >= 0 && o.tx + fw <= w && o.ty + fh <= h; }); M.marks = M.marks.filter(m => m.tx < w && m.ty < h); this.sel = []; this.reocc(); }); this.fit(); },
      tb: (() => { const r = {}; TOOLS.forEach(([id, l, k]) => { const on = id === S.tool; r[id] = { pick: () => this.setState({ tool: id }), title: `${l} (${k})`, bg: on ? '#c5d48a' : 'transparent', fg: on ? '#1a1e14' : '#d6d8c6', hov: on ? '#c5d48a' : '#2a3120' }; }); [['grid', 'Grid (Ctrl+G)'], ['col', 'Collision overlay']].forEach(([k, t]) => { r[k] = { pick: () => this.setState(s => ({ [k]: !s[k] })), title: t, bg: S[k] ? '#2a3120' : 'transparent', fg: S[k] ? '#c5d48a' : '#8b8f78', hov: '#2a3120' }; }); return r; })(),
      toolName: (TOOLS.find(t => t[0] === S.tool) || TOOLS[0])[1],
      showBrush: ['paint', 'line', 'rect', 'fill'].includes(S.tool), brushLabel: cur.label, brushThumb: cur.thumb || '', brushMk: cur.mk || '',
      zoomPct: S.zoom * 100 + '%',
      zoomIn: () => this.wrap && this.zoomAt(this.view.z + 1, this.wrap.clientWidth / 2, this.wrap.clientHeight / 2),
      zoomOut: () => this.wrap && this.zoomAt(this.view.z - 1, this.wrap.clientWidth / 2, this.wrap.clientHeight / 2),

      layers: LAYERS.map(([id, l]) => { const on = id === S.layer; return { label: l, count: cnt[id] || '', pick: () => setLayer(id), bg: on ? '#2a3120' : 'transparent', bd: on ? '#6f7d45' : '#2a2f24', fg: on ? '#e4e6d2' : '#d6d8c6',
        visLabel: S.vis[id] ? 'Shown' : 'Hidden', visFg: S.vis[id] ? '#c5d48a' : '#565b4c', toggleVis: () => this.setState(s => ({ vis: { ...s.vis, [id]: !s.vis[id] } })),
        lockLabel: S.lock[id] ? 'Locked' : 'Lock', lockFg: S.lock[id] ? '#d4a24a' : '#8b8f78', toggleLock: () => this.setState(s => ({ lock: { ...s.lock, [id]: !s.lock[id] } })) }; }),
      showCats: CATS.filter(c => CAT_LAYER[c[0]] === S.layer).length > 1,
      cats: CATS.filter(c => CAT_LAYER[c[0]] === S.layer).map(([id, l]) => ({ label: l, pick: () => this.setState({ cat: id, brush: (B.find(b => b.cat === id && b.id === S.brush) || B.find(b => b.cat === id)).id }), bg: id === S.cat ? '#2a3120' : 'transparent', fg: id === S.cat ? '#c5d48a' : '#8b8f78', bd: id === S.cat ? '#6f7d45' : '#2a2f24' })),
      items: B.filter(b => b.cat === S.cat).map(b => { const on = b.id === S.brush; return { label: b.label, thumb: b.thumb || '', mk: b.mk || '', bg: on ? '#2a3120' : '#161912', bd: on ? '#c5d48a' : '#2a2f24', fg: on ? '#e4e6d2' : '#8b8f78', pick: () => this.setState({ brush: b.id, tool: ['erase', 'pick', 'select', 'hand'].includes(S.tool) ? 'paint' : S.tool }) }; }),
      gateOpts: cur.kind === 'gate' && S.tool !== 'select', sideOpts: cur.kind === 'gate' && cur.o === 'v' && S.gateOpen,
      gateStates: [[false, 'Closed'], [true, 'Open']].map(([v, l]) => seg(S.gateOpen === v, () => this.setState({ gateOpen: v }), l)),
      gateSides: [['e', 'Swing E', 'Use on a west wall'], ['w', 'Swing W', 'Use on an east wall']].map(([v, l, t]) => seg(S.gateSide === v, () => this.setState({ gateSide: v }), l, { title: t })),
      baseOpts: S.layer === 'base',
      baseAuto: () => { if (M && this.editable('base')) this.commit(() => this.autoBase()); },
      baseClear: () => { if (M && this.editable('base')) this.commit(() => { M.base = M.base.map(() => 0); }); },
      hasSel: sel.length > 0,
      selTitle: one ? this.nameOf(one) : `${sel.length} selected`,
      selSub: one ? `${one.tx}, ${one.ty}` + (isMark(one) ? '' : `  ·  ${fpS[0]}×${fpS[1]}`) : 'Drag any of them to move all',
      selRows: rows,
      dupSel: () => this.dupSel(), delSel: () => this.delSel(), clearSel: () => { this.sel = []; this.bump(); },
      checks: (() => { const c = this.checks(); return c.length ? c.map(k => ({ text: k.text, dot: '#d4a24a', fg: '#d6d8c6', pick: () => { if (k.sel) { this.sel = k.sel.slice(); this.setState({ tool: 'select' }); } } })) : [{ text: 'No problems found.', dot: '#6f7d45', fg: '#8b8f78', pick: () => {} }]; })(),
      views: [['grid', 'Grid'], ['col', 'Collision']].map(([k, l]) => ({ label: l, pick: () => this.setState(s => ({ [k]: !s[k] })), bg: S[k] ? '#2a3120' : 'transparent', fg: S[k] ? '#c5d48a' : '#8b8f78', bd: S[k] ? '#6f7d45' : '#2a2f24' })),
      undo: () => this.step(this.undoS, this.redoS), redo: () => this.step(this.redoS, this.undoS),
      newMap: () => { if (!M) return; this.commit(() => this.load(this.blank(M.w, M.h, M.name))); },
      openMap: () => { const i = document.querySelector('input[data-open]'); if (i) { i.value = ''; i.click(); } },
      onFile: e => { const f = e.target.files && e.target.files[0]; if (!f) return; f.text().then(t => { let d; try { d = JSON.parse(t); } catch (err) { return; } if (d && d.format === 'survival-map' && d.w && d.h) { this.commit(() => this.load(d)); this.fit(); } }); },
      saveMap: () => { if (M) dl(new Blob([JSON.stringify(this.ser())], { type: 'application/json' }), slug(M.name) + '.survmap.json'); },
      exportPng: () => this.exportPng(), exportUnity: () => this.exportUnity()
