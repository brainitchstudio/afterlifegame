<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#171a14;color:#d6d8c6}a{color:#c5d48a}a:hover{color:#d9e6a4}canvas{image-rendering:pixelated}</style>
</helmet>
<div style="max-width:1320px;margin:0 auto;padding:40px 32px 80px;font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column;gap:40px">
  <header style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #2a2f24;padding-bottom:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <h1 style="margin:0;font-family:'Silkscreen',monospace;font-weight:400;font-size:36px;letter-spacing:1px;color:#e4e6d2">Molotov</h1>
      <p style="margin:0;font-size:13px;color:#8b8f78">Bottle tumbles in any direction · throw arc is done in code · fire frames 40×32, ground anchor at (20, 24) · click a sheet to download</p>
    </div>
    <button onClick="{{ exportSheet }}" style="font-family:'Silkscreen',monospace;font-size:14px;background:#c5d48a;color:#1a1e14;border:0;padding:12px 16px;cursor:pointer" style-hover="background:#d9e6a4">Export all sheets</button>
  </header>
  <section style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
      <h2 style="margin:0;font-family:'Silkscreen',monospace;font-weight:400;font-size:20px;color:#e4e6d2">Throw sweep</h2>
      <span style="font-size:11px;color:#8b8f78">{{ dirCount }} directions · arc → shatter → fire loop → burnout</span>
    </div>
    <div data-stage="1" style="display:grid;place-items:center;padding:20px;border:1px solid #2a2f24;overflow:auto"><canvas data-throw="1"></canvas></div>
  </section>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
    <section style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
        <h2 style="margin:0;font-family:'Silkscreen',monospace;font-weight:400;font-size:20px;color:#e4e6d2">{{ g.name }}</h2>
        <span style="font-size:11px;color:#8b8f78">{{ g.meta }}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
        <div data-stage="1" style="display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end;padding:20px;border:1px solid #2a2f24">
          <sc-for list="{{ g.cells }}" as="c" hint-placeholder-count="2">
            <figure style="margin:0;display:flex;flex-direction:column;gap:6px;align-items:center"><canvas data-fx="{{ c.key }}" data-hold="{{ c.hold }}"></canvas><figcaption style="font-size:11px;color:#d6d8c6;background:#12150f;padding:2px 6px">{{ c.label }}</figcaption></figure>
          </sc-for>
        </div>
        <sc-for list="{{ g.sheets }}" as="s" hint-placeholder-count="1">
          <div data-stage="1" style="display:grid;place-items:center;padding:20px;border:1px solid #2a2f24"><canvas data-asset="{{ s }}"></canvas></div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;zoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:1,&quot;max&quot;:6,&quot;step&quot;:1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;fps&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:4,&quot;max&quot;:20,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;rate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.25,&quot;min&quot;:0.5,&quot;max&quot;:3,&quot;step&quot;:0.25,&quot;unit&quot;:&quot;/s&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;dirs&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;8&quot;,&quot;16&quot;],&quot;default&quot;:&quot;16&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grass&quot;,&quot;dark&quot;,&quot;checker&quot;],&quot;default&quot;:&quot;grass&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const u = f => import(new URL(f, document.baseURI).href);
    Promise.all([u('pixel-assets-v2.js'), u('pixel-zombies.js'), u('pixel-molotov.js')]).then(([m, z, mo]) => {
      this.m = m; this.S = z.buildSurvivors().frames.guard; this.grass = m.buildAll().grass_a;
      const b = mo.buildMolotov(z.buildZombies().frames); this.F = b.frames; this.A = b.sheets;
      const C = { bottle: this.F.bottle, shadow: this.F.shadow, splash: this.F.splash, fire: this.F.fire, burnout: this.F.burnout, land: [...this.F.splash, ...this.F.fire, ...this.F.fire, ...this.F.burnout] };
      for (const k in this.F.burn) for (const d in this.F.burn[k]) C['burn_' + k + '_' + d] = this.F.burn[k][d];
      this.C = C; this.forceUpdate(); this.paint();
    });
    this.onClick = e => { const c = e.target.closest && e.target.closest('canvas[data-asset]'); if (c && this.m) this.m.download(this.A[c.dataset.asset], c.dataset.asset + '.png'); };
    document.addEventListener('click', this.onClick);
    this.t0 = performance.now();
    this.iv = setInterval(() => this.tick(), 40);
    const loop = () => { this.stage(); this.raf = requestAnimationFrame(loop); }; this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { document.removeEventListener('click', this.onClick); clearInterval(this.iv); cancelAnimationFrame(this.raf); }
  componentDidUpdate() { this.paint(); }
  cv(s) { if (!s._cv) { const c = document.createElement('canvas'); this.m.draw(c, s); s._cv = c; } return s._cv; }
  tick() {
    if (!this.C) return;
    const el = (performance.now() - this.t0) / 1000, fps = this.props.fps ?? 10, z = this.props.zoom ?? 4;
    document.querySelectorAll('canvas[data-fx]').forEach(c => {
      const fr = this.C[c.dataset.fx]; if (!fr) return;
      const hold = +(c.dataset.hold || 0), f = Math.floor(el * fps) % (fr.length + hold), fi = Math.min(f, fr.length - 1);
      if (c._f === fi && c._z === z) return; c._f = fi; c._z = z;
      this.m.draw(c, fr[fi]); c.style.width = fr[fi].w * z + 'px'; c.style.height = fr[fi].h * z + 'px';
    });
  }
  stage() {
    const c = document.querySelector('canvas[data-throw]'); if (!c || !this.F || !this.S) return;
    const W = 288, H = 216, z = this.props.zoom ?? 4, zs = Math.max(2, z - 1);
    if (c.width !== W) { c.width = W; c.height = H; }
    c.style.width = W * zs + 'px'; c.style.height = H * zs + 'px';
    const ctx = c.getContext('2d'); ctx.clearRect(0, 0, W, H);
    const n = +(this.props.dirs ?? 16), fps = this.props.fps ?? 10, per = 1 / (this.props.rate ?? 1.25), FT = 0.6;
    const t = (performance.now() - this.t0) / 1000, cur = Math.floor(t / per), cx = W / 2, cy = H / 2 + 6;
    const put = (s, x, y) => ctx.drawImage(this.cv(s), Math.round(x), Math.round(y));
    const fireLen = 6 + 16, life = FT + (fireLen + 4) / fps;
    const T = []; for (let j = cur; j >= 0 && t - j * per < life; j--) { const i = j % n, a = i * 2 * Math.PI / n; T.push({ a, age: t - j * per, dx: Math.cos(a), dy: Math.sin(a) }); }
    const D8 = ['e', 'se', 's', 'sw', 'w', 'nw', 'n', 'ne'], face = T[0] ? D8[Math.round(T[0].a / (Math.PI / 4)) % 8] : 's';
    const ground = [], air = [];
    T.forEach(s => {
      const lx = cx + s.dx * 104, ly = cy + s.dy * 74;
      if (s.age < FT) {
        const p = s.age / FT, gx = cx + s.dx * 8 + (lx - cx - s.dx * 8) * p, gy = cy + 4 + (ly - cy - 4) * p, h = 14 * (1 - p) + Math.sin(p * Math.PI) * 30;
        const sp = Math.floor(s.age * fps * 2.2), fi = ((s.dx >= 0 ? sp : -sp) % 8 + 8) % 8;
        air.push(() => { put(this.F.shadow[0], gx - 5, gy - 2); put(this.F.bottle[fi], gx - 7, gy - h - 7); });
      } else {
        const f = Math.floor((s.age - FT) * fps), L = this.F; let fr;
        if (f < 6) fr = L.splash[f]; else if (f < fireLen) fr = L.fire[(f - 6) % 8]; else if (f < fireLen + 4) fr = L.burnout[f - fireLen];
        if (fr) ground.push({ y: ly, draw: () => put(fr, lx - 20, ly - 24) });
      }
    });
    ground.push({ y: cy + 4, draw: () => put(this.S[face][0], cx - 12, cy - 22) });
    ground.sort((a, b) => a.y - b.y).forEach(g => g.draw());
    air.forEach(d => d());
  }
  paint() {
    const m = this.m; if (!m || !this.A) return;
    const z = this.props.zoom ?? 4, bg = this.props.stage ?? 'grass', zs = Math.max(1, z - 2);
    document.querySelectorAll('canvas[data-asset]').forEach(c => {
      const s = this.A[c.dataset.asset]; if (!s) return;
      m.draw(c, s); c.style.width = s.w * zs + 'px'; c.style.height = s.h * zs + 'px'; c.style.cursor = 'pointer'; c.title = 'Download ' + c.dataset.asset + '.png';
    });
    document.querySelectorAll('canvas[data-fx]').forEach(c => { c._z = null; });
    let css = '#12150f';
    if (bg === 'grass') css = `url(${m.tileURL(this.grass, z)}) repeat`;
    else if (bg === 'checker') { const q = 8 * z; css = `repeating-conic-gradient(#22261d 0% 25%, #191c15 0% 50%) 0 0 / ${q}px ${q}px`; }
    document.querySelectorAll('[data-stage]').forEach(d => { d.style.background = css; });
    this.tick();
  }
  renderVals() {
    const Z = [['walker', 'Walker'], ['runner', 'Runner'], ['brute', 'Brute'], ['bloater', 'Bloater'], ['soldier', 'Soldier']];
    const D = [['s', 'Down'], ['se', 'Down-right'], ['e', 'Right'], ['ne', 'Up-right'], ['n', 'Up'], ['nw', 'Up-left'], ['w', 'Left'], ['sw', 'Down-left']];
    return {
      dirCount: this.props.dirs ?? 16,
      groups: [
        { name: 'Bottle', meta: '14×14 · 8-frame tumble, reverse order for leftward throws · 10×4 ground shadow', sheets: ['molotov_bottle', 'molotov_shadow'], cells: [{ key: 'bottle', label: 'Tumble', hold: 0 }, { key: 'shadow', label: 'Shadow', hold: 0 }] },
        { name: 'Landing sequence', meta: 'splash → fire ×2 → burnout, played in order', sheets: [], cells: [{ key: 'land', label: 'Full sequence', hold: 6 }] },
        { name: 'Shatter + ignite', meta: '6 frames · plays once on landing', sheets: ['molotov_splash'], cells: [{ key: 'splash', label: 'Splash', hold: 4 }] },
        { name: 'Ground fire', meta: '8-frame seamless loop · also the damage zone', sheets: ['molotov_fire'], cells: [{ key: 'fire', label: 'Loop', hold: 0 }] },
        { name: 'Burnout', meta: '4 frames · last frame is the scorch decal', sheets: ['molotov_burnout', 'molotov_scorch'], cells: [{ key: 'burnout', label: 'Burnout', hold: 4 }] },
      ].concat(Z.map(([k, nm]) => ({ name: 'Burning ' + nm, meta: '24×28 · 8 dirs × 4 frames · same layout as the walk sheet, swap in while on fire', sheets: ['zombie_' + k + '_burning'], cells: D.map(([d, l]) => ({ key: 'burn_' + k + '_' + d, label: l, hold: 0 })) }))),
      exportSheet: () => this.m && this.A && this.m.exportAtlas(this.A, 'molotov-sheets')
    };
  }
}
</script>
</body>
</html>
